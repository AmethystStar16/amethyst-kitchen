<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Amethyst Kitchen</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f4f1;color:#222}header{padding:22px;background:#f5f4f1;position:sticky;top:0;z-index:4}h1{margin:0;font-size:27px}.sub{color:#777;margin-top:5px}nav{display:flex;gap:8px;padding:12px 18px;overflow:auto;position:sticky;top:78px;background:#f5f4f1;z-index:3}button{border:0;border-radius:14px;padding:11px 15px;background:#fff;font-weight:700;font-size:14px}.active,.primary{background:#222;color:#fff}.danger{background:#9c294b;color:#fff}.light{background:#fff;border:1px solid #ddd}main{padding:0 18px 90px}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.filters button{white-space:nowrap}.countrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.count,.card,.foodcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}.count b{font-size:23px;display:block;margin-top:4px}.foodcard{padding:0;overflow:hidden}.foodrow{display:flex;min-height:120px}.thumb{width:42%;object-fit:cover;background:#e9e5df}.placeholder{display:flex;align-items:center;justify-content:center;font-size:48px}.foodinfo{padding:14px;flex:1}.foodname{font-size:19px;font-weight:bold;margin-bottom:7px}.meta{color:#555;line-height:1.55}.detail{padding:12px;border-top:1px solid #eee}.detail img,.photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px}.badge{display:inline-block;margin-top:8px;border-radius:15px;padding:5px 9px;background:#999;color:#fff;font-size:11px}.expired{background:#b33f67}.soon{background:#c58a48}.amount{float:right;color:#777}.amount b{display:block;color:#555}.hidden{display:none!important}label{display:block;margin-top:8px;font-weight:600}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin:6px 0 10px;font-size:16px}.row{display:flex;gap:9px}.row>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:#888;padding:28px 10px}.boxitem{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}.fab{position:fixed;right:20px;bottom:75px;width:60px;height:60px;border-radius:50%;background:#e22;color:#fff;font-size:25px;z-index:5}
</style></head><body>
<header><h1>🏠 Amethyst Kitchen</h1><div class="sub">我的家庭食物管理</div></header>
<nav><button id="navHome" class="active" onclick="show('home')">🏠 Home</button><button id="navAdd" onclick="show('add')">➕ Add</button><button id="navBoxes" onclick="show('boxes')">📦 Boxes</button><button id="navSearch" onclick="show('search')">🔍 Search</button></nav>
<main>
<section id="home"><div class="filters"><button id="fAll" class="active" onclick="setFilter('All')">All</button><button id="fPantry" onclick="setFilter('Pantry')">🌿 Pantry</button><button id="fFreezer" onclick="setFilter('Freezer')">❄️ Freezer</button><button id="fFridge" onclick="setFilter('Fridge')">🧊 Fridge</button></div><div class="countrow"><div class="count">🧊 Fridge<b id="fridgeCount">0</b></div><div class="count">❄️ Freezer<b id="freezerCount">0</b></div><div class="count">🌿 Pantry<b id="pantryCount">0</b></div></div><div id="list"></div></section>
<section id="add" class="hidden"><div class="card"><h3>➕ Add Food</h3><label>食物名称</label><input id="food" placeholder="例如：三文鱼"><div class="row"><div><label>位置</label><select id="loc" onchange="suggestDays()"><option>Fridge</option><option>Freezer</option><option>Pantry</option></select></div><div><label>数量</label><input id="qty" placeholder="例如：2份"></div></div><label>📦 QR编号</label><input id="box" placeholder="例如 F&S-XXL-01" oninput="showBoxInfo()"><div id="boxInfo" class="sub"></div><label>📅 放入日期</label><input id="date" type="date" onchange="updateExpiry()"><label>⏳ 保存天数</label><input id="days" type="number" min="1" onchange="updateExpiry()"><input id="expiry" type="date" readonly><label>📸 食物照片（可选）</label><input id="foodPhoto" type="file" accept="image/*" capture="environment" onchange="previewFood(this)"><div id="foodPreview"></div><label>📍 放置位置照片（可选）</label><input id="locationPhoto" type="file" accept="image/*" capture="environment" onchange="previewLocation(this)"><div id="locationPreview"></div><br><button class="primary" onclick="addFood()">保存</button></div></section>
<section id="boxes" class="hidden"><div class="card"><h3>📦 我的盒子 / QR</h3><button class="primary" onclick="newBox()">＋新增</button><div id="boxList"></div></div></section>
<section id="boxForm" class="hidden"><div class="card"><h3>📦 设置盒子</h3><label>QR编号</label><input id="boxId"><label>盒子名称</label><input id="boxName" placeholder="例如 Fresh & Save XXL 2.85L"><label>备注</label><input id="boxNote"><button class="primary" onclick="saveBox()">保存盒子</button><button class="light" onclick="show('boxes')">取消</button></div></section>
<section id="search" class="hidden"><div class="card"><h3>🔍 Search</h3><input id="q" oninput="render()" placeholder="搜索食物或盒子编号"><div id="results"></div></div></section>
</main><button class="fab" onclick="show('add')">＋</button>
<script>
let foods=JSON.parse(localStorage.getItem('myKitchenFoods')||'[]'),boxes=JSON.parse(localStorage.getItem('myKitchenBoxes')||'[]'),foodPhotoData='',locationPhotoData='',currentFilter='All';const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function persist(){try{localStorage.setItem('myKitchenFoods',JSON.stringify(foods));localStorage.setItem('myKitchenBoxes',JSON.stringify(boxes));render();renderBoxes()}catch(e){alert('照片太大，请换较小的照片。')}}
function show(id){['home','add','boxes','boxForm','search'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');render();renderBoxes()}
function setFilter(v){currentFilter=v;['All','Pantry','Freezer','Fridge'].forEach(x=>{let b=$('f'+x);if(b)b.classList.toggle('active',x===v)});render()}
function daysDefault(l){return l==='Fridge'?3:l==='Freezer'?30:7}
function suggestDays(){if(!$('days').value)$('days').value=daysDefault($('loc').value);updateExpiry()}
function updateExpiry(){let d=$('date').value;if(!d)return;let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+parseInt($('days').value||3));$('expiry').value=x.toISOString().slice(0,10)}
function formatDate(d){if(!d)return '';let[y,m,day]=d.split('-');return day+'/'+m+'/'+y}
function daysLeft(e){if(!e)return null;return Math.ceil((new Date(e)-new Date().setHours(0,0,0,0))/86400000)}
function expiryBadge(x){let n=daysLeft(x.expiry);if(n===null)return '';if(n<0)return '<span class="badge expired">EXPIRED</span>';if(n<=3)return '<span class="badge soon">'+n+' DAYS LEFT</span>';return '<span class="badge">'+n+' DAYS</span>'}
function render(){let f=foods.filter(x=>x.loc==='Fridge').length,fr=foods.filter(x=>x.loc==='Freezer').length,p=foods.filter(x=>x.loc==='Pantry').length;$('fridgeCount').textContent=f;$('freezerCount').textContent=fr;$('pantryCount').textContent=p;let q=($('q')?.value||'').toLowerCase(),arr=foods.map((x,i)=>({...x,i})).filter(x=>(currentFilter==='All'||x.loc===currentFilter)&&((x.food+' '+x.box+' '+x.loc).toLowerCase().includes(q)));let html=arr.length?arr.map(card).join(''):'<div class="empty">还没有记录<br>扫一扫 QR，开始记录你的食物 ❤️</div>';$('list').innerHTML=html;if($('results'))$('results').innerHTML=html}
function card(x){let b=boxes.find(y=>y.id===x.box),img=x.foodPhoto||x.locationPhoto;return '<div class="foodcard"><div class="foodrow">'+(img?'<img class="thumb" src="'+img+'">':'<div class="thumb placeholder">🍱</div>')+'<div class="foodinfo"><div class="foodname">'+esc(x.food)+'</div><div class="meta">'+esc(x.loc)+'<br>📦 '+esc(x.box||'未指定')+(b?' · '+esc(b.name):'')+'</div>'+expiryBadge(x)+'<div class="amount">Amount<b>'+esc(x.qty||'Full')+'</b></div></div></div><div class="detail">放入：'+formatDate(x.date)+(x.expiry?' · 到期：'+formatDate(x.expiry):'')+(x.locationPhoto?'<img class="photo" src="'+x.locationPhoto+'">':'')+'<div class="actions"><button onclick="editFood('+x.i+')">编辑</button><button class="danger" onclick="removeFood('+x.i+')">删除</button></div></div></div>'}
function addFood(){let food=$('food').value.trim();if(!food){alert('请先输入食物名称');return}let d=$('date').value||new Date().toISOString().slice(0,10);if(!$('days').value)$('days').value=daysDefault($('loc').value);updateExpiry();foods.unshift({id:Date.now(),food,loc:$('loc').value,qty:$('qty').value,box:$('box').value.trim(),date:d,expiry:$('expiry').value,foodPhoto:foodPhotoData,locationPhoto:locationPhotoData});clearForm();persist();show('home')}
function clearForm(){['food','qty','box','date','days','expiry'].forEach(id=>$(id).value='');$('loc').value='Fridge';$('foodPreview').innerHTML='';$('locationPreview').innerHTML='';foodPhotoData='';locationPhotoData=''}
function removeFood(i){if(confirm('删除这项食物？')){foods.splice(i,1);persist()}}
function editFood(i){let x=foods[i];$('food').value=x.food;$('loc').value=x.loc;$('qty').value=x.qty||'';$('box').value=x.box||'';$('date').value=x.date||'';$('days').value=daysDefault(x.loc);$('expiry').value=x.expiry||'';foodPhotoData=x.foodPhoto||'';locationPhotoData=x.locationPhoto||'';foods.splice(i,1);show('add')}
function renderBoxes(){if(!$('boxList'))return;$('boxList').innerHTML=boxes.length?boxes.map((b,i)=>'<div class="boxitem"><div><b>'+esc(b.id)+'</b><br>'+esc(b.name||b.id)+'</div><button onclick="deleteBox('+i+')">删除</button></div>').join(''):'<div class="empty">还没有盒子。按「＋新增」绑定第一个 QR。</div>'}
function newBox(p=''){show('boxForm');$('boxId').value=p;$('boxName').value='';$('boxNote').value=''}
function saveBox(){let id=$('boxId').value.trim();if(!id){alert('请输入 QR 编号');return}if(boxes.some(b=>b.id===id)){alert('这个 QR 已经登记过了');return}boxes.push({id,name:$('boxName').value.trim()||id,note:$('boxNote').value.trim()});persist();show('boxes')}
function deleteBox(i){boxes.splice(i,1);persist()}
function showBoxInfo(){let b=boxes.find(x=>x.id===$('box').value.trim());$('boxInfo').textContent=b?'✅ 已登记：'+b.name:''}
function resizeImage(file,max){return new Promise((res,rej)=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.55))};im.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
function previewFood(i){let f=i.files[0];if(!f)return;resizeImage(f,500).then(d=>{foodPhotoData=d;$('foodPreview').innerHTML='<img class="photo" src="'+d+'">'})}
function previewLocation(i){let f=i.files[0];if(!f)return;resizeImage(f,500).then(d=>{locationPhotoData=d;$('locationPreview').innerHTML='<img class="photo" src="'+d+'">'})}
$('date').value=new Date().toISOString().slice(0,10);$('days').value=3;updateExpiry();render();renderBoxes();
</script></body></html>
