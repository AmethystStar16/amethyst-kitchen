<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Kitchen</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f5;color:#222}
header{background:white;padding:20px 18px;position:sticky;top:0;border-bottom:1px solid #ddd}
h1{margin:0 0 4px;font-size:25px}.sub{color:#777;font-size:13px}
nav{display:flex;gap:8px;padding:12px;position:sticky;top:82px;background:#f7f7f5;z-index:2}
button{border:0;border-radius:12px;padding:11px 13px;background:#222;color:white}
button.light{background:white;color:#222;border:1px solid #ddd}
main{padding:0 12px 30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:white;border:1px solid #e2e2e2;border-radius:16px;padding:15px;margin-bottom:12px}
.big{font-size:24px;font-weight:bold}.muted{color:#777;font-size:13px}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px;background:white}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{font-size:12px;background:#eee;border-radius:20px;padding:5px 8px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>🏠 My Kitchen</h1><div class="sub">我的家庭食物管理</div></header>
<nav>
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('add')">➕ Add</button>
<button onclick="show('search')">🔍 Search</button>
</nav>
<main>
<section id="home">
<div class="grid">
<div class="card"><div>🥬 Fridge</div><div class="big" id="fridgeCount">0</div></div>
<div class="card"><div>❄️ Freezer</div><div class="big" id="freezerCount">0</div></div>
<div class="card"><div>🥫 Pantry</div><div class="big" id="pantryCount">0</div></div>
</div>
<div class="card"><b>📦 我的食物</b><div id="list" style="margin-top:10px"></div></div>
</section>

<section id="add" class="hidden">
<div class="card">
<h3>➕ Add Food</h3>
<label>食物名称</label><input id="food" placeholder="例如：三文鱼">
<div class="row"><div><label>位置</label>
<select id="loc"><option>Fridge</option><option>Freezer</option><option>Pantry</option></select></div>
<div><label>数量</label><input id="qty" placeholder="例如：2份"></div></div>
<label>盒子 / QR编号</label><input id="box" placeholder="例如：F&S-XXL-01">
<label>放入日期</label><input id="date" type="date">
<button onclick="addFood()">保存</button>
</div>
</section>

<section id="search" class="hidden">
<div class="card">
<h3>🔍 Search</h3>
<input id="q" oninput="render()" placeholder="搜索食物或盒子编号">
<div id="results"></div>
</div>
</section>
</main>
<script>
let foods=JSON.parse(localStorage.getItem('myKitchenFoods')||'[]');
function save(){localStorage.setItem('myKitchenFoods',JSON.stringify(foods));render();}
function addFood(){
 let food=document.getElementById('food').value.trim();
 if(!food){alert('请先输入食物名称');return}
 foods.push({food,loc:loc.value,qty:qty.value,box:box.value,date:date.value});
 ['food','qty','box','date'].forEach(id=>document.getElementById(id).value='');
 save(); show('home');
}
function removeFood(i){if(confirm('删除这项食物？')){foods.splice(i,1);save();}}
function render(){
 let f=foods.filter(x=>x.loc==='Fridge').length;
 let fr=foods.filter(x=>x.loc==='Freezer').length;
 let p=foods.filter(x=>x.loc==='Pantry').length;
 fridgeCount.textContent=f; freezerCount.textContent=fr; pantryCount.textContent=p;
 let query=(document.getElementById('q')?.value||'').toLowerCase();
 let arr=foods.map((x,i)=>({...x,i})).filter(x=>(x.food+' '+x.box).toLowerCase().includes(query));
 let html=arr.length?arr.map(x=>`<div class="card item"><div><b>${esc(x.food)}</b><br><span class="muted">${esc(x.loc)} · ${esc(x.qty||'')} ${x.box?'· '+esc(x.box):''}<br>${x.date||''}</span></div><button class="light" onclick="removeFood(${x.i})">删除</button></div>`).join(''):'<div class="muted">还没有记录</div>';
 list.innerHTML=html;
 if(results) results.innerHTML=html;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){['home','add','search'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');render();}
render();
</script>
</body>
</html>
